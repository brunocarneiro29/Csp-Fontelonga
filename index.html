<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Centro Social Paroquial de Fontelonga</title>
  <link href="assets/img/cspf.png" rel="icon"/>
  <link href="assets/img/cspf.png" rel="apple-touch-icon"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="assets/css/main.css" rel="stylesheet"/>
  <style>
    body {
      background: #e6f7ff;
      margin: 0;
    }
    /* Header container */
    header {
      position: sticky;
      top: 0;
      background: transparent;
      z-index: 1030;
      padding: 1rem 0;
    }
    .header-wrapper {
      background: #fff;
      border-radius: 2rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0.5rem 1rem;
    }
    .logo img {
      height: 40px;
      width: auto;
    }
    .logo-text {
      margin-left: 0.5rem;
      font-weight: 700;
      color: #0d6efd;
    }
    /* Navigation links */
    .navmenu {
      display: flex;
      gap: 1rem;
    }
    .navmenu a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      white-space: nowrap;
    }
    /* Donativos button */
    .btn-donativos {
      padding: 0.4rem 1rem;
      border-radius: 50px;
      font-weight: 500;
    }
    /* Responsive: hide navmenu, keep button */
    @media (max-width: 991px) {
      .navmenu {
        display: none;
      }
      .header-wrapper {
        padding: 0.5rem;
      }
      .btn-donativos {
        margin-left: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-wrapper">
      <div class="d-flex align-items-center">
        <a href="/" class="logo d-flex align-items-center">
          <img src="assets/img/cspf.png" alt="Logo"/>
        </a>
        <span class="logo-text">Centro Social Paroquial de Fontelonga</span>
      </div>
      <nav class="navmenu">
        <a href="#home">Home</a>
        <a href="#sobre">Sobre nós</a>
        <a href="#servicos">Serviços</a>
        <a href="#contas">Contas de Gerência</a>
        <a href="#mural">Mural das Atividades</a>
        <a href="#contactos">Contactos</a>
      </nav>
      <a href="donativos.html" class="btn btn-primary btn-donativos">Donativos</a>
    </div>
  </header>
  <main>
    <!-- Hero and rest of content here unchanged -->
  </main>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
