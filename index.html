<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Centro Social Paroquial de Fontelonga</title>
  <link href="assets/img/cspf.png" rel="icon"/>
  <link href="assets/img/cspf.png" rel="apple-touch-icon"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="assets/css/main.css" rel="stylesheet"/>
  <style>
    body {
      background: #e6f7ff;
    }
    header {
      background: transparent;
    }
    .navbar-custom {
      background: #fff;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: calc(100% - 2rem);
      margin: 1rem auto;
      overflow: visible !important;
    }
    .navbar-custom .navmenu ul {
      list-style: none;
      display: flex;
      gap: 1rem;
      margin: 0;
      padding: 0;
      align-items: center;
      white-space: nowrap;
    }
    .navbar-custom .nav-link {
      color: #333;
      font-weight: 500;
      font-size: 0.9rem;
      text-decoration: none;
      padding: 0.4rem 0.6rem;
      white-space: nowrap;
    }
    .navbar-custom .btn-getstarted {
      padding: 0.4rem 1rem;
      border-radius: 50px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      position: relative;
      z-index: 1050;
      background-color: #0d6efd;
      border-color: #0d6efd;
    }
    @media (max-width: 991px) {
      .navbar-custom .navmenu {
        display: none !important;
      }
      /* Show button on mobile */
      .navbar-custom .btn-getstarted {
        margin-left: 0;
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        display: block;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="navbar-custom">
      <a href="/" class="logo d-flex align-items-center">
        <img src="assets/img/cspf.png" alt="Logo" style="height:40px;"/>
        <span class="ms-2 fw-bold">Centro Social Paroquial de <span style="color:#0d6efd;">Fontelonga</span></span>
      </a>
      <nav class="navmenu">
        <ul>
          <li><a class="nav-link active" href="#home">Home</a></li>
          <li><a class="nav-link" href="#sobre">Sobre nós</a></li>
          <li><a class="nav-link" href="#servicos">Serviços</a></li>
          <li><a class="nav-link" href="#contas">Contas de Gerência</a></li>
          <li><a class="nav-link" href="#mural">Mural das Atividades</a></li>
          <li><a class="nav-link" href="#contactos">Contactos</a></li>
        </ul>
      </nav>
      <a href="donativos.html" class="btn btn-primary btn-getstarted">Donativos</a>
    </div>
  </header>
  <main>
    <!-- Hero and rest of content unchanged -->
  </main>
</body>
</html>
